name: Build Android App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      # FIX: Injects the AndroidX flag directly into the command using -P to skip properties file forks
      - name: Build Code Base
        run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon --stacktrace
