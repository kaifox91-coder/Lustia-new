name: Build Android App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Force Clean Manifest Generation
        run: |
          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.App">
                  <activity 
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.App">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      # FIX: Hard-throttling workers and tasks to eliminate multi-threaded memory crashes
      - name: Build Code Base
        run: gradle assembleDebug --no-daemon --stacktrace --no-watch-fs --max-workers=1 --parallel=false
        env:
          GRADLE_OPTS: -Xmx1536m -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false

      - name: Save APK Result
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
