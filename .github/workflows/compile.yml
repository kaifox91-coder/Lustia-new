name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # FORCE COMPILE STEP: This searches for your gradle files and runs compilation wherever they are found
      - name: Locate and Execute Android Compilation
        run: |
          if [ -f "build.gradle" ]; then
            echo "Root build file detected. Compiling directly..."
            gradle assembleDebug --stacktrace
          else
            echo "Root build file not found. Searching subdirectories..."
            cd $(dirname $(find . -name "build.gradle" | head -n 1))
            echo "Moved into directory: $PWD"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
