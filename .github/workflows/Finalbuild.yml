name: Build Android App Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# No global GEMINI_API_KEY env — the key is injected directly into the Gradle
# invocation via -PgeminiApiKey so it never appears in environment dumps or logs.
# To configure: Settings → Secrets and variables → Actions → New repository secret
#   Name:  GEMINI_API_KEY
#   Value: your key from https://aistudio.google.com/app/apikey

jobs:
  build:
    name: Compile APK Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Set up Java Setup Environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Compiler Package Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
          cache-disabled: true

      - name: Build Pure Manifest File from Scratch
        run: |
          mkdir -p app/src/main
          echo "" | base64 --decode > app/src/main/AndroidManifest.xml

      - name: Purge Hidden Clipboard Null Bytes Globally
        run: |
          echo "Scanning all repository text files for hidden clipboard characters..."
          find . -type f -not -path '*/.*' -exec grep -Iq . {} \; -exec sed -i 's/\x00//g' {} +

      - name: Validate API Key Secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY_CHECK" ]; then
            echo "::error::GEMINI_API_KEY secret is not configured. Add it under:"
            echo "  Repository → Settings → Secrets and variables → Actions → New repository secret"
            echo "  Name: GEMINI_API_KEY   Value: your key from https://aistudio.google.com/app/apikey"
            exit 1
          fi
          echo "GEMINI_API_KEY secret is present — proceeding with build."
        env:
          GEMINI_API_KEY_CHECK: ${{ secrets.GEMINI_API_KEY }}

      - name: Build with Gradle
        shell: bash
        run: |
          gradle assembleDebug -p "$GITHUB_WORKSPACE" \
            -PgeminiApiKey="${{ secrets.GEMINI_API_KEY }}" \
            -Pandroid.useAndroidX=true \
            --no-daemon --no-build-cache --stacktrace
        env:
          GRADLE_OPTS: -Xmx1536m -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false

      - name: Upload Compiled APK Artifact Link
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
