name: Build Android App Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Normalize Project Resource Layout Structure
        run: |
          mkdir -p app/src/main/res/layout app/src/main/res/values
          find . -type f -name "*activity_main.xml" -not -path "*/res/layout/*" -exec mv {} app/src/main/res/layout/activity_main.xml \; 2>/dev/null || true
          find . -type f -name "*strings.xml" -not -path "*/res/values/*" -exec mv {} app/src/main/res/values/strings.xml \; 2>/dev/null || true
          find . -type f -name "*themes.xml" -not -path "*/res/values/*" -exec mv {} app/src/main/res/values/themes.xml \; 2>/dev/null || true

      # GUARANTEED FIX: Writes the manifest with raw escaped straight quotes, completely immune to mobile browser corruption
      - name: Overwrite with Clean Manifest
        run: |
          mkdir -p app/src/main
          printf "<manifest xmlns:android=\"http://android.com\"\n" > app/src/main/AndroidManifest.xml
          printf "    xmlns:tools=\"http://android.com\">\n" >> app/src/main/AndroidManifest.xml
          printf "    <uses-permission android:name=\"android.permission.INTERNET\" tools:node=\"merge\" />\n" >> app/src/main/AndroidManifest.xml
          printf "    <application\n" >> app/src/main/AndroidManifest.xml
          printf "        android:allowBackup=\"true\"\n" >> app/src/main/AndroidManifest.xml
          printf "        android:supportsRtl=\"true\"\n" >> app/src/main/AndroidManifest.xml
          printf "        android:label=\"@string/app_name\"\n" >> app/src/main/AndroidManifest.xml
          printf "        android:theme=\"@style/Theme.App\"\n" >> app/src/main/AndroidManifest.xml
          printf "        tools:node=\"merge\">\n" >> app/src/main/AndroidManifest.xml
          printf "        <activity\n" >> app/src/main/AndroidManifest.xml
          printf "            android:name=\".MainActivity\"\n" >> app/src/main/AndroidManifest.xml
          printf "            android:exported=\"true\"\n" >> app/src/main/AndroidManifest.xml
          printf "            android:theme=\"@style/Theme.App\"\n" >> app/src/main/AndroidManifest.xml
          printf "            tools:node=\"merge\">\n" >> app/src/main/AndroidManifest.xml
          printf "            <intent-filter>\n" >> app/src/main/AndroidManifest.xml
          printf "                <action android:name=\"android.intent.action.MAIN\" />\n" >> app/src/main/AndroidManifest.xml
          printf "                <category android:name=\"android.intent.category.LAUNCHER\" />\n" >> app/src/main/AndroidManifest.xml
          printf "            </intent-filter>\n" >> app/src/main/AndroidManifest.xml
          printf "        </activity>\n" >> app/src/main/AndroidManifest.xml
          printf "    </application>\n" >> app/src/main/AndroidManifest.xml
          printf "</manifest>\n" >> app/src/main/AndroidManifest.xml

      - name: Set up Java Setup Environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Compiler Package Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
          cache-disabled: true

      - name: Execute Background Compilation Steps
        run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon --no-build-cache --stacktrace

      - name: Upload Compiled APK Artifact Link
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
