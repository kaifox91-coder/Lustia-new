name: Build Android App Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# API key reference pattern — set GEMINI_API_KEY as a GitHub Actions repository secret.
# To add the secret: Settings → Secrets and variables → Actions → New repository secret.
# Name: GEMINI_API_KEY  Value: your key from https://aistudio.google.com/app/apikey
# If the secret is absent the build proceeds with an empty key (AI features will be disabled).
env:
  # Safe reference — resolves to empty string when the secret is not configured.
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  build:
    name: Compile APK Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Set up Java Setup Environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Compiler Package Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
          cache-disabled: true

      - name: Build Pure Manifest File from Scratch
        run: |
          mkdir -p app/src/main
          echo "" | base64 --decode > app/src/main/AndroidManifest.xml

      - name: Purge Hidden Clipboard Null Bytes Globally
        run: |
          echo "Scanning all repository text files for hidden clipboard characters..."
          find . -type f -not -path '*/.*' -exec grep -Iq . {} \; -exec sed -i 's/\x00//g' {} +

      - name: Validate API Key Configuration
        shell: bash
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::warning::GEMINI_API_KEY is not set. The APK will build successfully but AI chat features will not work at runtime."
            echo "To enable AI features, add GEMINI_API_KEY as a GitHub Actions secret:"
            echo "  Repository → Settings → Secrets and variables → Actions → New repository secret"
            echo "  Name: GEMINI_API_KEY"
            echo "  Value: your key from https://aistudio.google.com/app/apikey"
          else
            echo "GEMINI_API_KEY is configured — AI features will be enabled in this build."
          fi

      - name: Build with Gradle
        shell: bash
        run: |
          mkdir -p ~/.gradle

          # Write the API key (empty or real) into gradle.properties so Gradle can read it.
          if [ ! -f ~/.gradle/gradle.properties ]; then
            printf "GEMINI_API_KEY=%s\n" "${GEMINI_API_KEY}" > ~/.gradle/gradle.properties
          elif ! grep -q '^GEMINI_API_KEY=' ~/.gradle/gradle.properties; then
            printf "\nGEMINI_API_KEY=%s\n" "${GEMINI_API_KEY}" >> ~/.gradle/gradle.properties
          fi

          gradle assembleDebug -p "$GITHUB_WORKSPACE" -Pandroid.useAndroidX=true --no-daemon --no-build-cache --stacktrace
        env:
          GRADLE_OPTS: -Xmx1536m -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false

      - name: Upload Compiled APK Artifact Link
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
