name: Build Android App Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Normalize Project Resource Layout Structure
        run: |
          mkdir -p app/src/main/res/layout app/src/main/res/values
          find . -type f -name "*activity_main.xml" -not -path "*/res/layout/*" -exec mv {} app/src/main/res/layout/activity_main.xml \; 2>/dev/null || true
          find . -type f -name "*strings.xml" -not -path "*/res/values/*" -exec mv {} app/src/main/res/values/strings.xml \; 2>/dev/null || true
          find . -type f -name "*themes.xml" -not -path "*/res/values/*" -exec mv {} app/src/main/res/values/themes.xml \; 2>/dev/null || true

      - name: Set up Java Setup Environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Compiler Package Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
          cache-disabled: true

      # FIX: Added 'clean' to destroy corrupt cache folders, and '--no-daemon' to enforce pure-thread building
      - name: Execute Background Compilation Steps
        run: ./gradlew clean assembleDebug -Pandroid.useAndroidX=true --no-daemon --no-build-cache --stacktrace || gradle clean assembleDebug -Pandroid.useAndroidX=true --no-daemon --no-build-cache --stacktrace
        env:
          GRADLE_OPTS: -Xmx1536m -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false

      - name: Upload Compiled APK Artifact Link
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
