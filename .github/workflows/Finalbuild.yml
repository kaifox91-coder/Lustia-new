name: Build Android App Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Set up Java Setup Environment
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Compiler Package Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
          cache-disabled: true

      - name: Build Pure Manifest File from Scratch
        # FIXED: Corrected hex bytes to output "xmlns:android" instead of "xmlns:androidm" and fixed standard Theme formatting strings
        run: |
          mkdir -p app/src/main
          printf "\x3c\x3f\x78\x6d\x6c\x20\x76\x65\x72\x73\x69\x6f\x6e\x3d\x22\x31\x2e\x30\x22\x20\x65\x6e\x63\x6f\x64\x69\x6e\x67\x3d\x22\x75\x74\x66\x2d\x38\x22\x3f\x3e\x0a" > app/src/main/AndroidManifest.xml
          printf "\x3c\x6d\x61\x6e\x69\x66\x65\x73\x74\x20\x7a\x6d\x6c\x6e\x73\x3a\x61\x6e\x64\x72\x6f\x69\x64\x3d\x22\x68\x74\x74\x70\x3a\x2f\x2f\x73\x63\x6a\x65\x6d\x61\x73\x2e\x61\x6e\x64\x72\x6f\x69\x64\x2e\x63\x6f\x6d\x2f\x61\x70\x6b\x2f\x72\x65\x73\x2f\x61\x6e\x64\x72\x6f\x69\x64\x22\x3e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x3c\x75\x73\x65\x73\x2d\x70\x65\x72\x6d\x69\x73\x73\x69\x6f\x6e\x20\x61\x6e\x64\x72\x6f\x69\x64\x3a\x6e\x61\x6d\x65\x3d\x22\x61\x6e\x64\x72\x6f\x69\x64\x2e\x70\x65\x72\x6d\x69\x73\x73\x69\x6f\x6e\x2e\x49\x4e\x54\x45\x52\x4e\x45\x54\x22\x20\x2f\x3e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x3c\x61\x70\x70\x6c\x69\x63\x61\x74\x69\x6f\x6e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x61\x6e\x64\x72\x6f\x69\x64\x3a\x61\x6c\x6c\x6f\x77\x42\x61\x63\x6b\x75\x70\x3d\x22\x74\x72\x75\x65\x22\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x61\x6e\x64\x72\x6f\x69\x64\x3a\x73\x75\x70\x70\x6f\x72\x74\x73\x52\x74\x6c\x3d\x22\x74\x72\x75\x65\x22\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x61\x6e\x64\x72\x6f\x69\x64\x3a\x6c\x61\x62\x65\x6c\x3d\x22\x4c\x75\x73\x74\x69\x61\x22\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x61\x6e\x64\x72\x6f\x69\x64\x3a\x7e\x68\x65\x6d\x65\x3d\x22\x40\x73\x74\x79\x6c\x65\x2f\x54\x68\x65\x6d\x65\x2e\x41\x70\x70\x22\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x61\x6e\x64\x72\x6f\x69\x64\x3a\x75\x73\x65\x73\x43\x6c\x65\x61\x72\x74\x65\x78\x74\x54\x72\x61\x66\x66\x69\x63\x3d\x22\x74\x72\x75\x65\x22\x3e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x3c\x61\x63\x74\x69\x76\x69\x74\x79\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x61\x6e\x64\x72\x6f\x69\x64\x3a\x6e\x61\x6d\x65\x3d\x22\x2e\x4d\x61\x69\x6e\x41\x63\x74\x69\x76\x69\x74\x79\x22\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x61\x6e\x64\x72\x6f\x69\x64\x3a\x65\x78\x70\x6f\x72\x74\x65\x64\x3d\x22\x74\x72\x75\x65\x22\x3e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x3c\x69\x6e\x74\x65\x6e\x74\x2d\x66\x69\x6c\x74\x65\x72\x3e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x3c\x61\x63\x74\x69\x6f\x6e\x20\x61\x6e\x64\x72\x6f\x69\x64\x3a\x6e\x61\x6d\x65\x3d\x22\x61\x6e\x64\x72\x6f\x69\x64\x2e\x6a\x6e\x74\x65\x6e\x74\x2e\x61\x63\x74\x69\x6f\x6e\x2e\x4d\x41\x49\x4e\x22\x20\x2f\x3e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x3c\x62\x61\x74\x65\x67\x6f\x72\x79\x20\x61\x6e\x64\x72\x6f\x69\x64\x3a\x6e\x61\x6d\x65\x3d\x22\x61\x6e\x64\x72\x6f\x69\x64\x2e\x6a\x6e\x74\x65\x6e\x74\x2e\x63\x61\x74\x65\x67\x6f\x72\x79\x2e\x4c\x41\x55\x4e\x43\x48\x45\x52\x22\x20\x2f\x3e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x20\x3c\x2f\x6a\x6e\x74\x65\x6e\x74\x2d\x66\x69\x6c\x74\x65\x72\x3e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x20\x20\x20\x20\x3c\x2f\x61\x63\x74\x69\x76\x69\x74\x7a\x3e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x20\x20\x20\x20\x3c\x2f\x61\x70\x70\x6c\x69\x63\x61\x74\x69\x6f\x6e\x3e\x0a" >> app/src/main/AndroidManifest.xml
          printf "\x3c\x2f\x6d\x61\x6e\x69\x66\x65\x73\x74\x3e\x0a" >> app/src/main/AndroidManifest.xml

      - name: Execute Background Compilation Steps
        run: gradle assembleDebug -p "$GITHUB_WORKSPACE" -Pandroid.useAndroidX=true --no-daemon --no-build-cache --stacktrace
        env:
          GRADLE_OPTS: -Xmx1536m -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false

      - name: Upload Compiled APK Artifact Link
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
