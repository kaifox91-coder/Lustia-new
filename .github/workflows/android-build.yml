name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

        steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Note: Android SDK is pre-installed on ubuntu-latest runners. 
      # You can usually delete the setup-android step entirely to speed up your build.

      # THIS STEP REPLACES BOTH 'Cache Gradle' AND 'Build debug APK'
      - name: Setup and Run Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          arguments: assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
