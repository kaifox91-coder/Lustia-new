name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      # FIX: We tell the checkout step to completely ignore your heavy or corrupted git commit submodules/history trees
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Execute Android Compilation
        run: gradle assembleDebug --stacktrace
