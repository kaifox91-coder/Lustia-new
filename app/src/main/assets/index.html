<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dungeon Floor Boss</title>
  <style>
    body { font-family: system-ui, Roboto, Arial; margin:12px; background:#071226; color:#e6eef8; }
    .card { background:#0b1220; padding:12px; border-radius:8px; margin-bottom:12px; }
    input, textarea { width:100%; padding:8px; border-radius:6px; border:1px solid #213445; background:#071226; color:#e6eef8; }
    button { padding:10px 12px; border-radius:6px; background:#2563eb; color:white; border:0; }
    pre { white-space:pre-wrap; word-wrap:break-word; color:#cfe6ff; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Dungeon Floor Boss — Test</h2>
    <label>OpenAI API Key (optional on Android)</label>
    <input id="apiKey" placeholder="sk-..." />
    <div style="height:8px"></div>
    <label>Prompt</label>
    <textarea id="prompt" rows="6">You are a dungeon boss. Describe one opening move.</textarea>
    <div style="height:8px"></div>
    <button id="send">Send</button>
  </div>

  <div class="card">
    <h3>Response</h3>
    <pre id="out">—</pre>
  </div>

  <script>
    // Simple callback registry for native responses
    const callbacks = {};
    function genId() { return 'cb_' + Math.random().toString(36).slice(2); }

    // Called by Android native side
    window.handleNativeResponse = function(callbackId, payloadString) {
      try {
        const cb = callbacks[callbackId];
        if (!cb) return;
        delete callbacks[callbackId];
        const parsed = JSON.parse(payloadString);
        cb.resolve(parsed);
      } catch (e) {
        console.error(e);
      }
    };

    // Dungeon API helper: either proxy to Android or use fetch (browser)
    const DungeonAPI = {
      setApiKey: (k) => localStorage.setItem('openai_key', k),
      getApiKey: () => localStorage.getItem('openai_key'),
      sendPrompt: async function(prompt) {
        const payload = {
          model: "gpt-4o-mini",
          messages: [{ role: "user", content: prompt }],
          max_tokens: 800
        };
        const cbId = genId();
        return new Promise((resolve, reject) => {
          callbacks[cbId] = { resolve, reject };
          const json = JSON.stringify(payload);
          if (window.AndroidBridge && window.AndroidBridge.openAIProxy) {
            try {
              window.AndroidBridge.openAIProxy(json, cbId);
            } catch (e) { reject(e); }
          } else {
            // Browser fallback using fetch + local key
            const key = DungeonAPI.getApiKey();
            if (!key) return reject("No API key");
            fetch("https://api.openai.com/v1/chat/completions", {
              method: "POST",
              headers: { "Content-Type":"application/json", "Authorization":"Bearer "+key },
              body: json
            }).then(r=>r.json()).then(data=>{
              resolve(data);
            }).catch(reject);
          }
        });
      }
    };

    document.getElementById('send').addEventListener('click', async () => {
      const prompt = document.getElementById('prompt').value;
      const key = document.getElementById('apiKey').value.trim();
      if (key) DungeonAPI.setApiKey(key);
      document.getElementById('out').textContent = 'Waiting...';
      try {
        const res = await DungeonAPI.sendPrompt(prompt);
        // Show either structured response or choices
        if (res.choices && res.choices.length) {
          document.getElementById('out').textContent = res.choices.map(c=>c.message?.content||JSON.stringify(c)).join("\n\n");
        } else {
          document.getElementById('out').textContent = JSON.stringify(res, null, 2);
        }
      } catch (e) {
        document.getElementById('out').textContent = 'Error: ' + String(e);
      }
    });
  </script>
</body>
</html>
