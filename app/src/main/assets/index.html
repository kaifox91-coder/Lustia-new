<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dungeon Floor Boss</title>
  <style>
    body { font-family: system-ui, Roboto, Arial; margin:12px; background:#071226; color:#e6eef8; }
    .card { background:#0b1220; padding:12px; border-radius:8px; margin-bottom:12px; }
    input, textarea { width:100%; padding:8px; border-radius:6px; border:1px solid #213445; background:#071226; color:#e6eef8; box-sizing: border-box; }
    button { padding:10px 12px; border-radius:6px; background:#2563eb; color:white; border:0; font-weight: bold; cursor: pointer; }
    button:disabled { background:#1d4ed8; opacity: 0.6; }
    pre { white-space:pre-wrap; word-wrap:break-word; color:#cfe6ff; font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Dungeon Floor Boss Console</h2>
    <label>Google Gemini API Key</label>
    <input id="apiKey" type="password" placeholder="AIzaSy..." />
    <div style="height:12px"></div>
    <label>Dungeon Master Prompt</label>
    <textarea id="prompt" rows="6">You are a dungeon boss. Describe one opening move.</textarea>
    <div style="height:12px"></div>
    <button id="send">Send Action</button>
  </div>

  <div class="card">
    <h3>Engine Output</h3>
    <pre id="out">—</pre>
  </div>

  <script>
    const callbacks = {};
    function genId() { return 'cb_' + Math.random().toString(36).slice(2); }

    window.handleNativeResponse = function(callbackId, payloadString) {
      try {
        const cb = callbacks[callbackId];
        if (!cb) return;
        delete callbacks[callbackId];
        const parsed = JSON.parse(payloadString);
        cb.resolve(parsed);
      } catch (e) {
        console.error("Native bridge parse error:", e);
      }
    };

    const DungeonAPI = {
      setApiKey: (k) => {
        if (window.AndroidBridge && window.AndroidBridge.setApiKey) {
          window.AndroidBridge.setApiKey(k);
        } else {
          localStorage.setItem('gemini_key', k);
        }
      },
      getApiKey: () => {
        if (window.AndroidBridge && window.AndroidBridge.getApiKey) {
          return window.AndroidBridge.getApiKey();
        }
        return localStorage.getItem('gemini_key');
      },
      sendPrompt: async function(promptText) {
        const cbId = genId();
        
        // Pure Gemini Request Structure
        const geminiPayload = {
          contents: [{
            role: "user",
            parts: [{ text: promptText }]
          }]
        };
        const payloadString = JSON.stringify(geminiPayload);

        return new Promise((resolve, reject) => {
          callbacks[cbId] = { resolve, reject };

          if (window.AndroidBridge && window.AndroidBridge.openAIProxy) {
            try {
              // Pass the pure Gemini structure straight down to the native app proxy
              window.AndroidBridge.openAIProxy(payloadString, cbId);
            } catch (e) { 
              reject(e); 
            }
          } else {
            // Direct browser fallback testing endpoint
            const key = DungeonAPI.getApiKey();
            if (!key) {
              delete callbacks[cbId];
              return reject("Please save your Gemini API Key first.");
            }

            fetch(`https://googleapis.com{key}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: payloadString
            })
            .then(r => r.json())
            .then(data => resolve(data))
            .catch(err => {
              delete callbacks[cbId];
              reject(err);
            });
          }
        });
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = DungeonAPI.getApiKey();
      if (savedKey) document.getElementById('apiKey').value = savedKey;
    });

    document.getElementById('send').addEventListener('click', async () => {
      const button = document.getElementById('send');
      const promptText = document.getElementById('prompt').value;
      const key = document.getElementById('apiKey').value.trim();
      
      if (key) DungeonAPI.setApiKey(key);
      
      document.getElementById('out').textContent = 'Consulting the Gemini Engine...';
      button.disabled = true;

      try {
        const res = await DungeonAPI.sendPrompt(promptText);
        
        // Directly extract Gemini text structure fields natively
        if (res.candidates && res.candidates[0]?.content?.parts[0]?.text) {
          document.getElementById('out').textContent = res.candidates[0].content.parts[0].text;
        } else {
          document.getElementById('out').textContent = JSON.stringify(res, null, 2);
        }
      } catch (e) {
        document.getElementById('out').textContent = 'Error: ' + String(e);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
