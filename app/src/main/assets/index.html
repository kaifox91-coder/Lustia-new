<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lustia Bridge Harness</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:16px; }
    .card { background:#111827; border:1px solid #374151; border-radius:14px; padding:16px; margin-bottom:16px; }
    input, textarea, button { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid #374151; background:#1f2937; color:#e5e7eb; padding:10px; }
    button { cursor:pointer; font-weight:600; }
    .btn-group { display:flex; gap:8px; }
    .btn-group button { flex:1; }
    .secondary { background:#111827; }
    pre { white-space:pre-wrap; background:#020617; border:1px solid #334155; border-radius:10px; padding:10px; min-height:70px; }
    label { display:block; margin:8px 0 6px; font-size:13px; color:#93c5fd; }
    .muted { color:#94a3b8; font-size:12px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🧩 Android JS Bridge Test Panel</h2>
    <p class="muted">Uses AndroidBridge when present. Browser fallback calls Gemini REST with private key entry only.</p>

    <label>Google Gemini API Key</label>
    <input id="apiKey" type="password" placeholder="AIzaSy..." />
    <div style="height:12px"></div>

    <label>Dungeon Prompt</label>
    <textarea id="prompt" rows="4">You are a dungeon boss. Describe one opening move.</textarea>

    <div class="btn-group" style="margin-top:10px;">
      <button id="send">Send Action</button>
    </div>
  </div>

  <div class="card">
    <h3>Engine Output</h3>
    <pre id="out">—</pre>
  </div>

  <div class="card" style="border-color: #dc2626;">
    <h3 style="color:#ef4444;">Diagnostic logs</h3>
    <pre id="logBox">System initialized cleanly.</pre>
    <div class="btn-group">
      <button id="copyLog" class="secondary">Copy Log</button>
    </div>
  </div>

  <script>
    const callbacks = {};
    function genId() { return 'cb_' + Math.random().toString(36).slice(2); }

    function logDiag(message, isError = false) {
      const logBox = document.getElementById('logBox');
      const timestamp = new Date().toLocaleTimeString();
      const newLine = `[${timestamp}] ${isError ? '❌' : 'ℹ️'} ${message}\n`;
      if (logBox.textContent === 'System initialized cleanly.') logBox.textContent = newLine;
      else logBox.textContent += newLine;
      logBox.scrollTop = logBox.scrollHeight;
    }

    window.handleNativeResponse = function(callbackId, payloadString) {
      logDiag(`Native callback returned for ID: ${callbackId}`);
      try {
        const cb = callbacks[callbackId];
        if (!cb) return logDiag('No matching registry tracking found.', true);
        delete callbacks[callbackId];
        cb.resolve(JSON.parse(payloadString));
      } catch (e) {
        logDiag(`Parse error: ${e.message}`, true);
      }
    };

    const DungeonAPI = {
      setApiKey: (k) => {
        if (window.AndroidBridge && window.AndroidBridge.setApiKey) {
          window.AndroidBridge.setApiKey(k);
          logDiag('API key synced to secure storage.');
        } else {
          localStorage.setItem('gemini_key', k);
        }
      },
      getApiKey: () => {
        if (window.AndroidBridge && window.AndroidBridge.getApiKey) {
          return window.AndroidBridge.getApiKey();
        }
        return localStorage.getItem('gemini_key');
      },
      sendPrompt: async function(promptText) {
        const cbId = genId();
        const payload = { prompt: promptText };
        logDiag(`Dispatching packet ID: ${cbId}`);

        return new Promise((resolve, reject) => {
          callbacks[cbId] = { resolve, reject };

          if (window.AndroidBridge && window.AndroidBridge.openAIProxy) {
            window.AndroidBridge.openAIProxy(JSON.stringify(payload), cbId);
          } else {
            logDiag('Browser fallback routing...');
            const key = DungeonAPI.getApiKey();
            if (!key) return reject('Missing API key configuration.');

            const geminiPayload = { contents: [{ role: 'user', parts: [{ text: promptText }] }] };
            fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(geminiPayload)
            })
              .then((r) => r.json())
              .then((j) => resolve(j))
              .catch((e) => reject(e));
          }
        });
      }
    };

    document.getElementById('send').addEventListener('click', async () => {
      const key = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const out = document.getElementById('out');

      if (!prompt) {
        out.textContent = 'Please enter a prompt.';
        return;
      }

      if (key) DungeonAPI.setApiKey(key);

      out.textContent = 'Thinking...';
      try {
        const res = await DungeonAPI.sendPrompt(prompt);
        const text = res?.candidates?.[0]?.content?.parts?.map(p => p.text).join(' ') || JSON.stringify(res, null, 2);
        out.textContent = text || 'No output';
        logDiag('Response handled successfully.');
      } catch (e) {
        out.textContent = `Error: ${e?.message || e}`;
        logDiag(`Request failed: ${e?.message || e}`, true);
      }
    });

    document.getElementById('copyLog').addEventListener('click', async () => {
      const text = document.getElementById('logBox').textContent;
      try {
        await navigator.clipboard.writeText(text);
        logDiag('Diagnostic log copied.');
      } catch {
        logDiag('Clipboard copy failed.', true);
      }
    });
  </script>
</body>
</html>
