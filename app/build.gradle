plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.10'
}

android {
    namespace 'com.dungeonboss.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dungeonboss.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // Single-source key resolution:
        // 1. Gradle project property — pass via -PgeminiApiKey=... (used by CI and local CLI)
        // 2. Fallback: secrets.properties in the project root (local dev convenience only)
        def geminiApiKey = project.findProperty('geminiApiKey')?.toString()

        if (!geminiApiKey || geminiApiKey.isEmpty()) {
            def secretsFile = rootProject.file('secrets.properties')
            if (secretsFile.exists()) {
                def props = new Properties()
                secretsFile.withInputStream { props.load(it) }
                geminiApiKey = props.getProperty('geminiApiKey')
            }
        }

        if (!geminiApiKey || geminiApiKey.isEmpty()) {
            throw new GradleException(
                "CRITICAL: geminiApiKey was not found.\n" +
                "  CI: pass via -PgeminiApiKey=\${{ secrets.GEMINI_API_KEY }}\n" +
                "  Local: add geminiApiKey=YOUR_KEY to secrets.properties or " +
                "~/.gradle/gradle.properties"
            )
        }

        buildConfigField "String", "GEMINI_KEY", "\"${geminiApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        compose true
        buildConfig true
    }
    
    composeOptions {
        // Aligned to 1.5.3 to match Kotlin 1.9.10
        kotlinCompilerExtensionVersion '1.5.3'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // Core engine packages required for native Gemini operations
    implementation 'com.google.ai.client.generativeai:generativeai:0.4.0'
    
    // Native runtime scopes to cleanly cycle threading events
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    
    // Jetpack Compose UI
    implementation 'androidx.compose.ui:ui:1.5.4'
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation 'androidx.compose.foundation:foundation:1.5.4'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    
    // Networking & JSON
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
}
