buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // FIXED: Declaring build scripts directly in the module secures the manifest namespace compilers
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.dungeonboss.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dungeonboss.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // Official Google Android SDK packages required for native Gemini operations
    implementation 'com.google.ai.client.generativeai:generativeai:0.2.2'
    
    // Native runtime scopes to cleanly cycle threading events
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
}
