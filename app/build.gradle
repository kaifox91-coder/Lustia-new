plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.10'
}

android {
    namespace 'com.dungeonboss.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dungeonboss.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // Load API key from secrets.properties (local dev) or GEMINI_API_KEY env var (CI/CD).
        // To set up locally: copy secrets.properties.example -> secrets.properties and fill in your key.
        def secretsFile = rootProject.file("secrets.properties")
        def geminiApiKey = ""
        if (secretsFile.exists()) {
            def secrets = new Properties()
            secretsFile.withInputStream { secrets.load(it) }
            geminiApiKey = secrets.getProperty("GEMINI_API_KEY", "")
        }
        if (!geminiApiKey) {
            geminiApiKey = System.getenv("GEMINI_API_KEY") ?: ""
        }
        if (!geminiApiKey) {
            logger.warn("\n[WARNING] GEMINI_API_KEY is not set. " +
                "Copy secrets.properties.example to secrets.properties and add your key, " +
                "or set the GEMINI_API_KEY environment variable.\n")
        }
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        compose true
        buildConfig true
    }
    
    composeOptions {
        // Aligned to 1.5.3 to match Kotlin 1.9.10
        kotlinCompilerExtensionVersion '1.5.3'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // Core engine packages required for native Gemini operations
    implementation 'com.google.ai.client.generativeai:generativeai:0.4.0'
    
    // Native runtime scopes to cleanly cycle threading events
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    
    // Jetpack Compose UI
    implementation 'androidx.compose.ui:ui:1.5.4'
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation 'androidx.compose.foundation:foundation:1.5.4'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    
    // Networking & JSON
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
}
